databases:
  - name: datumlex-db-pedromattos
    plan: free
    region: virginia
    postgresMajorVersion: "17"
    databaseName: datumlex_v2
    user: datumlex
    ipAllowList: []

services:
  - type: web
    runtime: python
    name: datumlex-api-pedromattos
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate && python manage.py bootstrap_support && python manage.py bootstrap_datajud && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: datumlex-db-pedromattos
          property: connectionString
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: datumlex-api-pedromattos.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://datumlex-web-pedromattos.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://datumlex-web-pedromattos.onrender.com
      - key: SESSION_COOKIE_SAMESITE
        value: None
      - key: CSRF_COOKIE_SAMESITE
        value: None
      - key: DATUMLEX_SUPPORT_PASSWORD
        sync: false
      - key: DATAJUD_API_KEY
        sync: false

  - type: web
    runtime: static
    name: datumlex-web-pedromattos
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://datumlex-api-pedromattos.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: same-origin
