# Ambiente local opcional para executar SonarQube Community + Scanner sobre o DatumLex.
# Uso:
#   1. python scripts/test-report.py
#   2. docker compose -f docker-compose.sonar.yml up -d sonarqube
#   3. Aguarde http://localhost:9000 iniciar, gere um token e rode:
#      SONAR_TOKEN=<seu-token> docker compose -f docker-compose.sonar.yml run --rm sonar-scanner
services:
  sonarqube:
    image: sonarqube:community
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:latest
    profiles: ["scan"]
    depends_on:
      - sonarqube
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    volumes:
      - .:/usr/src

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
