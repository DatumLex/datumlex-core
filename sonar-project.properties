# SonarQube / SonarCloud configuration for DatumLex (Backend Python + Frontend React/Vite)
# Authenticate via environment variable SONAR_TOKEN (never commit tokens to Git).
sonar.organization=datumlex
sonar.projectKey=DatumLex_datumlex-core
sonar.projectName=DatumLex
sonar.projectVersion=2.0

sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/tests/unit
sonar.sourceEncoding=UTF-8
sonar.python.version=3.13

# Test execution & coverage reports generated by `python scripts/test-report.py`
sonar.python.coverage.reportPaths=output/coverage/backend-coverage.xml
sonar.python.xunit.reportPath=output/coverage/backend-junit.xml
sonar.javascript.lcov.reportPaths=output/coverage/frontend-lcov.info

# Exclusions (generated files, migrations, dependencies, offline/experimental scripts, static reports)
sonar.exclusions=**/migrations/**,**/__pycache__/**,**/node_modules/**,**/dist/**,**/output/**,**/*.html,**/*.png,**/*.pdf,tools/nlp_validation/**,backend/docs/**,deploy/**,backend/datumlex.session.sql,backend/src/nlp/__main__.py,backend/src/nlp/cache.py,backend/src/services/real_staging_prep.py,backend/src/db/management/commands/materialize_civil_pilot.py,frontend/src/nlpDemo.jsx,scripts/local_ops.py,backend/Dockerfile,.github/workflows/**
sonar.coverage.exclusions=**/migrations/**,**/management/commands/**,**/tests/**,**/main.jsx,**/nlpDemo.jsx
sonar.cpd.exclusions=**/migrations/**,**/tests/**
