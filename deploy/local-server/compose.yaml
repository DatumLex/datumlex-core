name: datumlex-server
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: datumlex
      POSTGRES_USER: datumlex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run Instalar.cmd first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U datumlex -d datumlex']
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build:
      context: ../..
      dockerfile: deploy/local-server/backend.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://datumlex:${POSTGRES_PASSWORD}@db:5432/datumlex
      DJANGO_SETTINGS_MODULE: config.server_settings
      DJANGO_DEBUG: 'false'
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Run Instalar.cmd first}
      DJANGO_ALLOWED_HOSTS: ${SERVER_HOST},localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://${SERVER_HOST}
      CORS_ALLOWED_ORIGINS: https://${SERVER_HOST}
      DATUMLEX_SUPPORT_PASSWORD: ${DATUMLEX_SUPPORT_PASSWORD:?Run Instalar.cmd first}
      DATAJUD_API_KEY: ${DATAJUD_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 30s
  web:
    build:
      context: ../..
      dockerfile: deploy/local-server/web.Dockerfile
    restart: unless-stopped
    environment:
      SERVER_HOST: ${SERVER_HOST:?Run Instalar.cmd first}
    ports:
      - '${SERVER_HOST}:443:443'
    volumes:
      - certificates:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:2019/config/']
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  database:
  certificates:
  caddy_config:
