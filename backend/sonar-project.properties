# Legacy backend-only SonarQube entry point.
# Prefer running sonar-scanner from the repository root (`sonar-project.properties`)
# with SONAR_TOKEN and SONAR_HOST_URL provided via environment variables.
sonar.projectKey=br.edu.fatec:datumlex
sonar.projectName=DatumLex
sonar.projectVersion=2.0
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.13
sonar.python.coverage.reportPaths=../output/coverage/backend-coverage.xml
sonar.python.xunit.reportPath=../output/coverage/backend-junit.xml
sonar.exclusions=**/migrations/**,**/__pycache__/**,tests/relatorio-cobertura.html
