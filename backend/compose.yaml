services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: datumlex
      POSTGRES_USER: datumlex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - datumlex_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datumlex -d datumlex"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  datumlex_pg:
