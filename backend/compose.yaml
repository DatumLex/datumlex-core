services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: datumlex_v2
      POSTGRES_USER: datumlex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Preencha POSTGRES_PASSWORD no arquivo backend/.env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - datumlex_pg_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datumlex -d datumlex_v2"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - qtsw-network

  sonar_db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    volumes:
      - sonar_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - qtsw-network

  sonarqube:
    image: sonarqube:community
    hostname: sonarqube
    depends_on:
      sonar_db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar_db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - qtsw-network

volumes:
  datumlex_pg_v2:
  sonar_pg_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  qtsw-network:
    driver: bridge