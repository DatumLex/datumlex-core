services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: datumlex
      POSTGRES_USER: datumlex
      POSTGRES_PASSWORD: datumlex
    ports:
      - "5433:5432"
    volumes:
      - datumlex_pg:/var/lib/postgresql/data
    healthcheck:
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  datumlex_pg:
