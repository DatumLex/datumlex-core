name: Testes e cobertura

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes DatumLex
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python scripts/test-report.py
      - name: Salvar relatório HTML
        if: ${{ !cancelled() && hashFiles('output/coverage/index.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-datumlex
          path: output/coverage/index.html
          if-no-files-found: error
